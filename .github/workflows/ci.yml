name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      # NOTE: '**.md' is deliberately absent. Root-level docs (README, BASELINE,
      # AGENTS, SOUL, ...) are load-bearing and must stay CI-gated; the bulk
      # markdown under docs/ and research/ is still exempt.
      - 'docs/**'
      - 'research/**'
      - 'data-next/**'
      - '.cursor/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'research/**'
      - 'data-next/**'
      - '.cursor/**'

concurrency:
  group: gzmo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # Workspace Cargo.toml denies clippy correctness/suspicious and allows style debt,
      # so `-D warnings` stays a real gate without failing on pre-existing pedantic noise.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: |
          set -o pipefail
          cargo test --all 2>&1 | tee /tmp/cargo-test.log

      # BASELINE.md carries generated counts. Without this gate it silently
      # rotted for 45 days and claimed 133 tests against an actual 384.
      - name: Baseline is current
        run: ./scripts/baseline-refresh.sh --check --test-log /tmp/cargo-test.log

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded Neo4j password in tracked files
        run: |
          # Line-anchored TOML/env literals only (exclude shell "$(...)" expansions).
          if git grep -E '^[[:space:]]*NEO4J_PASSWORD[[:space:]]*=[[:space:]]*"[^"$]+"' -- '*.toml' '*.md' '*.rs' '*.sh' \
             ':!gzmo.toml.example' ':!.env.template' ':!gzmo.toml'; then
            echo "Hardcoded NEO4J_PASSWORD found in tracked files"
            exit 1
          fi
