name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded Neo4j password in tracked files
        run: |
          if git grep -E 'NEO4J_PASSWORD\s*=\s*"[^"]+"' -- '*.toml' '*.md' '*.rs' '*.sh' \
             ':!gzmo.toml.example' ':!.env.template'; then
            echo "Hardcoded NEO4J_PASSWORD found in tracked files"
            exit 1
          fi
