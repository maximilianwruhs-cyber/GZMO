name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # Fail on correctness/suspicious only; style debt is tracked separately.
      - name: Clippy
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious

      - name: Test
        run: cargo test --all

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded Neo4j password in tracked files
        run: |
          # Match quoted literals only (exclude shell/env expansions like "$(...)").
          if git grep -E '^[[:space:]]*NEO4J_PASSWORD[[:space:]]*=[[:space:]]*"[^"$]+"' -- '*.toml' '*.md' '*.rs' '*.sh' \
             ':!gzmo.toml.example' ':!.env.template' ':!gzmo.toml'; then
            echo "Hardcoded NEO4J_PASSWORD found in tracked files"
            exit 1
          fi
