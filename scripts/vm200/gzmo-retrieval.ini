; GZMO VM200 retrieval router presets (llama-server --models-preset).
; Deploy: scripts/vm200/deploy-retrieval-router.sh

[*]
fit = off
sleep-idle-seconds = 600

[gzmo-embed]
model = /opt/models/Qwen3-Embedding-0.6B-Q8_0.gguf
embedding = true
pooling = last
ctx-size = 1024
ngl = 99

[gzmo-rerank]
model = /opt/models/Qwen3-Reranker-0.6B.F16.gguf
embedding = true
pooling = rank
reranking = true
ctx-size = 2048
ngl = 99
