# GZMO-next — workstation lab/dev config (NOT production after 2026-07-17)
# ─────────────────────────────────────────────────────────────────────────
#
# Production living host is CT101 (/opt/gzmo + gzmo-daemon). This file
# (also linked as config/gzmo.toml) drives lab/dev on the workstation only.
#
#   config  → GZMO/config/gzmo.toml (= this file via symlink)
#   data    → GZMO/data-next/   (lab scratch — do not import into CT101)
#
# Env contract (operator + optional lab gzmo serve):
#   export GZMO_INSTANCE=next
#   export GZMO_CONFIG=$GZMO_CLONE_ROOT/GZMO/config/gzmo.toml
#
# Overnight authority: CT101 gzmo-daemon only.
# Keep workstation gzmo-serve / gzmo-scheduler DISABLED by default.
# Never run lab serve overnight alongside CT101.
# See GZMO/docs/CT101_RESTORE_LIVING.md, ADR-0003, CT101_BOUNDARY.md.
#
# Calibration output from gzmo-handoff.sh lands in gzmo-next-fused.toml
# (sibling file) for operator review — it never overwrites this file.
#
# Relative paths below are anchored to this file's directory (GZMO/config/),
# so ../data-next/... resolves to GZMO/data-next/ wherever the clone lives.

[identity]
soul_path = "SOUL-next.md"

[memory]
directory = "../data-next/memory"
vault_db = "../data-next/vault.db"
vault_backend = "sqlite"

[skills]
directory = "../skills"
dreams_path = "../data-next/DREAMS.md"

# ─────────────────────────────────────────────────────────────────────────
# Assembly backends — the GZMO-next wire (parsed by gzmo-core config)
# ─────────────────────────────────────────────────────────────────────────
#
# "lab"    → daemon loop shells to a Little Tools Lab recipe script
# "inline" → daemon loop uses the legacy in-process engine (CT101 behavior)

[assembly]
distill = "lab"        # synapse-distill-handoff.sh (session_end → distill jobs)
dream = "lab"          # session-to-dream.sh
spark = "lab"          # cognition-smoke.sh stages 3–4 (spark-link + rrf-recall)
ops_health = "lab"     # ops-smoke.sh
config_handoff = "lab" # gzmo-handoff.sh (bench → fuse → apply on gate pass)

# ─────────────────────────────────────────────────────────────────────────
# Engines / loops — workstation baseline, lab recipes own the heavy lifting
# ─────────────────────────────────────────────────────────────────────────

[dreams]
enabled = true
verify = true
min_confidence = 0.85
verify_temperature = 0.1
require_evidence = true
strict_kg = true        # local Neo4j sidecar via Docker
cron_hour = 1
cron_minute = 0
chunk_chars = 28000
min_consolidation_chars = 400
honeypot_rem_enabled = true

[session_distill]
enabled = true
sessions_dir = "../data-next/sessions"
use_librarian = true
librarian_summary = true
daemon_scheduled = true
cron_hour = 2
cron_minute = 15

[spark]
enabled = true
verify = true
min_confidence = 0.85
schedule_mode = "cron"
cron_hours = [3, 22]
cron_minute = 30
max_tokens_hypothesis = 4096
max_tokens_verify = 4096
anchor_min_age_hours = 0

[ingest]
enabled = false          # continuous watcher OFF
batch_enabled = true     # nightly gzmo ingest-dir via scheduler
inbox_path = "../data-next/inbox"
cron_hour = 2
cron_minute = 0

[wiki]
enabled = true
backend = "okforge"
emit_after_distill = true
emit_after_dream = true
emit_on_ingest = false
push_cron_hour = 5
push_cron_minute = 30

[wiki.okforge]
url = "http://127.0.0.1:3000"
owner = "gzmo"
repo = "gzmo-next-memory"
token_env = "OKFORGE_TOKEN"
agent_id = "gzmo-next"
auto_commit = true
open_pr = false

[kg_reconcile]
enabled = true
cron_hour = 4
cron_minute = 30
dry_run = true           # flip to false after one verified live apply

[pedagogy]
enabled = true
cron_weekday = 0         # Sunday
cron_hour = 6
cron_minute = 0

[cabinet]
enabled = true
cron_weekday = 0         # Sunday
cron_hour = 6
cron_minute = 30

[health]
strict_startup = false

# Workstation-local Qdrant/Redis/Prime; VM200 for embed/rerank only.
[embeddings]
enabled = true
url = "http://192.168.31.110:8081/v1"
model = "gzmo-embed"
api_key = ""

[qdrant]
enabled = true
url = "http://127.0.0.1:6333"
collection = "honeypot"
sync_enabled = true
sync_cron_hour = 1
sync_cron_minute = 45

[librarian]
enabled = true
url = "http://localhost:8000/v1"
model = "/run/media/gzmo/Extreme SSD/swap/huggingface/llamacpp-qwen36-mtp/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"
api_key = ""

[rerank]
enabled = true
url = "http://192.168.31.110:8081/v1"
model = "gzmo-rerank"
api_key = ""
prefetch_multiplier = 4

# ─────────────────────────────────────────────────────────────────────────
# Engine — workstation Prime (llama.cpp :8000)
# Calibrated 2026-07-16: merged from gzmo-next-fused.toml (gate 1.0, beat-gate PASS).
# RAPL routing omitted (fits_budget=false). See sibling *-fused.toml for full snapshot.
# ─────────────────────────────────────────────────────────────────────────

[inference.defaults]
temperature = 0.70
top_p = 0.95

[engine]
active_mode = "local"

lorenz_seed = 0.506
strategy = "lorenz"
[engine.local]
provider = "local"
url = "http://localhost:8000/v1"
model = "/run/media/gzmo/Extreme SSD/swap/huggingface/llamacpp-qwen36-mtp/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"
api_key = ""
temperature = 0.70
top_p = 0.95
max_tokens = 24576

[chaos]
# ADR-0003: chaos is opt-in chat ritual — off by default on living instance.
enabled_in_chat = false
bpm_default = 120
dt_lorenz = 0.5

# Overnight metabolism cron extras (promote/embed slots for `gzmo serve`)
[metabolism]
enabled = true
promote_cron_hour = 2
promote_cron_minute = 30
embed_cron_hour = 2
embed_cron_minute = 45

[benchmark.fused]
verify_pass_rate = 0.9000
temp_report = "temp-report.json"
verify_report = "verify-report.json"

[benchmark.gate]
min_pass_rate = 0.85
action_on_fail = "hold_previous"

[agent]
max_tool_iterations = 40
heartbeat_interval_secs = 1800

[workflow_skills]
enabled = true
dir = "../skills/workflows"
model_can_activate = true
max_active = 2
handoff_dir = "../data-next/handoffs"
handoff_to_vault = true

[tools]
profile = "developer"
audit = true

[subagent]
max_concurrent = 5

# ─────────────────────────────────────────────────────────────────────────
# Scratch / queues — file fallback, isolated key prefix
# ─────────────────────────────────────────────────────────────────────────

[redis]
enabled = true
url = "redis://127.0.0.1:6379"
distill_queue = "gzmo-next:distill:pending"
distill_fallback_dir = "../data-next/distill-queue"

[context_memory]
archive_threshold = 0.90
response_reserve = 0.10
scratch_max_tokens = 2000
context_length = 131072

# Cognition on Prime (:8000) — librarian extract uses the same endpoint as local engine.
[routing]
default_engine = "local"

[routing.mappings]
dream_extract = "local"
dream_verify = "local"
spark_hypothesis = "local"
spark_verify = "local"
ingest_extract = "local"
ingest_verify = "local"
distill_extract = "local"
distill_verify = "local"
distill_summary = "local"

# ─────────────────────────────────────────────────────────────────────────
# MCP — local Neo4j (Docker sidecar on workstation)
# ─────────────────────────────────────────────────────────────────────────

[[mcp_servers]]
name = "memory"
command = "/home/gzmo/.local/bin/uvx"
args = ["--from", "/home/gzmo/github-clone/mcp-neo4j-memory-gzmo", "mcp-neo4j-memory"]

[mcp_servers.env]
NEO4J_URL = "bolt://127.0.0.1:7687"
NEO4J_USERNAME = "neo4j"
NEO4J_PASSWORD = "${NEO4J_PASSWORD}"
NEO4J_DATABASE = "neo4j"
