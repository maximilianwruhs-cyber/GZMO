# ─── Jokes: Structural anatomy of humor (meta-comedy) ───

[[jokes]]
text = "Setup: The establishment of a false, highly logical reality. Must be entirely devoid of comedy to ensure the pattern takes hold."

[[jokes]]
text = "Misdirection: The invisible cognitive pivot point — the audience's brain is looking left while the punchline arrives from the right."

[[jokes]]
text = "Punchline: The climax that violently subverts the expectation while still technically complying with the grammatical or logical parameters established in the setup."

[[jokes]]
text = "The Rule of Three: It takes exactly three data points for the human brain to detect a pattern. First item (premise), second item (confirms pattern), third item (destroys it)."

[[jokes]]
text = "Superiority Theory (Aristotle): Laughter is the expression of sudden glory over another's failings. Paradoxically weaponized via self-deprecation to lower the comedian's status and engender audience trust."

[[jokes]]
text = "Relief Theory (Freud): Humor is a biological pressure valve. Tension built through taboo, suspense, or social awkwardness is suddenly purged through the punchline."

[[jokes]]
text = "Benign Violation Theory: Humor triggers if and only if three conditions occur simultaneously — a violation, a benign context, and simultaneous processing of both."

[[jokes]]
text = "The Pre-Punchline Pause: Deliberate silence spikes anticipation, signaling an imminent pattern disruption. The post-punchline pause allows the crowd's slower cognitive processors to calculate the incongruity."

