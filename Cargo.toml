[workspace]
resolver = "2"
members = ["gzmo-core", "gzmo-cli", "gzmo-chaos", "gzmo-scheduler", "crates/eml-core", "crates/evolution-contracts", "gzmo-evolver"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Maximilian Wruhs"]

[workspace.dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Markdown Parsing
pulldown-cmark = "0.12"

# Filesystem Watching
notify = "7"

# HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
reqwest-eventsource = "0.6"

# Error Handling
anyhow = "1"
thiserror = "2"

# Async Trait
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# SSE streaming
futures-util = "0.3"

# Scratch cache + distill queue
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Embedding cache keys
sha2 = "0.10"

# Schema generation
schemars = { version = "0.8", features = ["chrono", "uuid1"] }


# CLI
clap = { version = "4", features = ["derive"] }

# File locking
fs2 = "0.4"

# Unix process-group termination (killpg) for ProcessRunner
libc = "0.2"

# Unix identity/fs metadata for sealed worker ownership checks
nix = { version = "0.31", default-features = false, features = ["user", "fs"] }

# Strict remote URL parsing for credential-free Git identity checks
url = "2"


[workspace.lints.rust]
unused_mut = "allow"
unused_comparisons = "allow"
dead_code = "allow"

[workspace.lints.clippy]
# Style/pedantic debt is large; keep CI `-D warnings` meaningful for real bugs only.
all = "allow"
correctness = "deny"
suspicious = "deny"
