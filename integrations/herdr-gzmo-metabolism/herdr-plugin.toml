id = "gzmo.metabolism"
name = "GZMO Metabolism"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Attach gzmo-memory MCP and close agent panes with a distill takeaway ritual."
platforms = ["linux", "macos"]

[[actions]]
id = "ensure-mcp"
title = "Ensure gzmo-memory MCP"
contexts = ["workspace"]
command = ["bash", "bin/ensure-mcp.sh"]

[[actions]]
id = "session-close"
title = "Close with takeaway → distill"
contexts = ["pane", "workspace"]
command = ["bash", "bin/session-close.sh"]

[[actions]]
id = "status"
title = "GZMO metabolism status"
contexts = ["workspace"]
command = ["bash", "bin/status.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "bin/on-pane-closed.sh"]

[[panes]]
id = "close-ritual"
title = "GZMO session close"
placement = "overlay"
command = ["bash", "bin/session-close.sh", "--interactive"]
