[package]
name = "eml-core"
version = "0.1.0"
edition = "2021"
description = "Exp-Minus-Log symbolic computation engine — ComplexBall arithmetic, RPN emit, zero-copy execution"

[dependencies]
num-complex = "0.4"
thiserror = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "system_benchmarks"
harness = false

# NOTE: `[profile.*]` is only honoured at the workspace root; it lives in the
# root Cargo.toml so cargo stops warning that this section is ignored.
