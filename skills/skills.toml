# ═══════════════════════════════════════════════════════════════════
# GZMO Skill Registry — The Command Pantheon
# ═══════════════════════════════════════════════════════════════════
# Every slash command the agent can execute is defined here.
# The dispatcher reads this file to route commands to handler scripts.

[meta]
version = "1.1"
total_commands = 18
engine = "chaos"  # All RNG seeded from Randomizer's Lorenz attractor

# ─── Chaos & Games ───────────────────────────────────────────────

[commands.dice]
description = "Throws a D6 or D20 and generates a chaos-event tied to the result"
args = "[D6|D20]"
type = "hybrid"
handler = "skill_dice.sh"
icon = "🎲"

[commands.poker]
description = "Deals a full 5-card poker hand and evaluates the rank"
args = ""
type = "static"
handler = "skill_poker.sh"
icon = "🃏"

[commands.card]
description = "Legendary Attractor Forge — MTG cards (Color Pie, phase lens, forge sparks, corpus, ASCII frame)"
args = "[creature|instant|sorcery|enchantment|artifact|planeswalker]"
type = "generative"
handler = "skill_card.sh"
icon = "🂡"

[commands.pkm]
description = "Legendary Attractor Forge — Pokemon cards (Element, phase lens, forge sparks, corpus, ASCII frame)"
args = "[pokemon|trainer|energy]"
type = "generative"
handler = "skill_pkm.sh"
icon = "⚡"

